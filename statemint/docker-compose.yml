version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: statemint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-statemint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statemint_secret}
      POSTGRES_DB: ${POSTGRES_DB:-statemint_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-statemint}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: statemint_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: statemint_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-statemint}:${POSTGRES_PASSWORD:-statemint_secret}@postgres:5432/${POSTGRES_DB:-statemint_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_changeinprod}
      JWT_EXPIRES_IN: 7d
      HF_API_TOKEN: ${HF_API_TOKEN}
      HF_CATEGORIZATION_MODEL: facebook/bart-large-mnli
      HF_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      UPLOAD_DIR: /app/uploads
      PORT: 4000
    volumes:
      - ./apps/api/src:/app/src
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    container_name: statemint_worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-statemint}:${POSTGRES_PASSWORD:-statemint_secret}@postgres:5432/${POSTGRES_DB:-statemint_db}
      REDIS_URL: redis://redis:6379
      HF_API_TOKEN: ${HF_API_TOKEN}
      HF_CATEGORIZATION_MODEL: facebook/bart-large-mnli
      HF_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./apps/api/src:/app/src
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data: